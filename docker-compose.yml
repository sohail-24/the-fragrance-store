version: '3.8'

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: proxy
    image: freshflow-nginx
    container_name: freshflow-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - product_uploads:/app/uploads
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - freshflow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: freshflow-app
    container_name: freshflow-app
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-changeme}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-changeme}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}      
      - PORT=3000
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ADMIN_ORDER_EMAIL=${ADMIN_ORDER_EMAIL}
      - APP_URL=${APP_URL}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_HOST=${SMTP_HOST}
      - OWNER_EMAIL=${OWNER_EMAIL}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_SECURE=${SMTP_SECURE}

    depends_on:
      db:
        condition: service_healthy
    volumes:
      - product_uploads:/app/uploads
    networks:
      - freshflow-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1); })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15
    container_name: freshflow-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=freshflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - freshflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d freshflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  product_uploads:

networks:
  freshflow-network:
    driver: bridge
