<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#24211D" />
      <stop offset="45%" stop-color="#181715" />
      <stop offset="100%" stop-color="#0E0D0C" />
    </radialGradient>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5CA92" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8E6C2D" />
    </linearGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9C7733" />
      <stop offset="25%" stop-color="#E8CE99" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="75%" stop-color="#F2DEC0" />
      <stop offset="100%" stop-color="#7D5C20" />
    </linearGradient>
    <linearGradient id="glassElixir" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF1E0" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#E2BD75" stop-opacity="0.75" />
      <stop offset="75%" stop-color="#C5963E" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#724B10" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="plinthReflect" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#C5A059" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="1200" height="675" fill="url(#bgGlow)" />

  <!-- Architectural Subtle Grid Lines -->
  <g stroke="#C5A059" stroke-opacity="0.07" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="675" />
    <line x1="1040" y1="0" x2="1040" y2="675" />
    <line x1="0" y1="520" x2="1200" y2="520" />
    <circle cx="600" cy="360" r="320" fill="none" stroke-width="0.75" stroke-dasharray="4 8" />
  </g>

  <!-- Pedestal / Surface Grounding -->
  <ellipse cx="600" cy="540" rx="360" ry="42" fill="url(#plinthReflect)" />
  <ellipse cx="600" cy="525" rx="260" ry="22" fill="#131210" stroke="#C5A059" stroke-opacity="0.35" stroke-width="1" />

  <!-- Ambient Light Halo -->
  <ellipse cx="600" cy="330" rx="200" ry="240" fill="#C5A059" fill-opacity="0.08" filter="blur(40px)" />

  <!-- Shadow Base -->
  <ellipse cx="600" cy="520" rx="130" ry="16" fill="#050505" fill-opacity="0.8" />

  <!-- MAIN PERFUME FLACON (Center) -->
  <g transform="translate(600, 320)">
    <!-- Flacon Outer Glass -->
    <rect x="-115" y="-120" width="230" height="290" rx="14" fill="#181512" stroke="url(#goldSheen)" stroke-width="2.5" />
    
    <!-- Elixir Liquid Reservoir -->
    <rect x="-96" y="-70" width="192" height="225" rx="8" fill="url(#glassElixir)" />
    
    <!-- Glass Bevels and Highlights -->
    <rect x="-110" y="-115" width="220" height="280" rx="10" fill="url(#glassReflection)" />
    
    <!-- Vertical Specular Light Stripe -->
    <path d="M -75 -110 L -65 -110 L -65 160 L -75 160 Z" fill="#FFFFFF" fill-opacity="0.25" />
    <path d="M 75 -110 L 80 -110 L 80 160 L 75 160 Z" fill="#FFFFFF" fill-opacity="0.15" />

    <!-- Label Cartouche -->
    <g transform="translate(0, 30)">
      <rect x="-70" y="-45" width="140" height="90" rx="3" fill="#FDFBF7" stroke="#C5A059" stroke-width="1.2" />
      <rect x="-65" y="-40" width="130" height="80" rx="2" fill="none" stroke="#E4E0D8" stroke-width="0.8" />
      <text x="0" y="-16" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="9" letter-spacing="3" fill="#8E6C2D" font-weight="600">PARFUM ÉDITION</text>
      <text x="0" y="6" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="19" letter-spacing="4" fill="#111111" font-weight="700">SOLSTICE</text>
      <line x1="-30" y1="16" x2="30" y2="16" stroke="#C5A059" stroke-width="0.75" />
      <text x="0" y="27" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" letter-spacing="2" fill="#555555">EXTRAIT DE PARFUM · 100 ML</text>
    </g>

    <!-- Flacon Neck -->
    <rect x="-32" y="-150" width="64" height="30" rx="2" fill="url(#goldCap)" stroke="#8E6C2D" stroke-width="1" />
    <rect x="-24" y="-146" width="48" height="6" fill="#FDFBF7" fill-opacity="0.3" />

    <!-- Flacon Heavy Gold Sculptural Cap -->
    <rect x="-56" y="-210" width="112" height="60" rx="6" fill="url(#goldCap)" stroke="#4A3614" stroke-width="1.5" />
    <!-- Cap Crown Chamfer -->
    <path d="M -56 -200 L -46 -210 L 46 -210 L 56 -200 Z" fill="#F5E4C4" fill-opacity="0.4" />
    <line x1="-50" y1="-180" x2="50" y2="-180" stroke="#7D5C20" stroke-width="1.2" />
    <circle cx="0" cy="-180" r="4" fill="#FDFBF7" />
  </g>

  <!-- Left Accent Flacon (Silhouette) -->
  <g transform="translate(320, 360) scale(0.65)" opacity="0.45">
    <rect x="-90" y="-130" width="180" height="260" rx="10" fill="#141312" stroke="#C5A059" stroke-width="2" />
    <rect x="-40" y="-170" width="80" height="40" rx="4" fill="url(#goldCap)" />
    <rect x="-60" y="-220" width="120" height="50" rx="4" fill="#242220" stroke="#C5A059" stroke-width="1" />
  </g>

  <!-- Right Accent Flacon (Silhouette) -->
  <g transform="translate(880, 360) scale(0.65)" opacity="0.45">
    <ellipse cx="0" cy="0" rx="95" ry="120" fill="#141312" stroke="#C5A059" stroke-width="2" />
    <rect x="-28" y="-160" width="56" height="40" rx="2" fill="url(#goldCap)" />
    <circle cx="0" cy="-190" r="32" fill="url(#goldCap)" stroke="#4A3614" stroke-width="1" />
  </g>

  <!-- Gold Dust Speckles -->
  <g fill="#C5A059" opacity="0.6">
    <circle cx="480" cy="220" r="1.5" />
    <circle cx="510" cy="260" r="1" />
    <circle cx="720" cy="240" r="1.5" />
    <circle cx="700" cy="190" r="1" />
    <circle cx="440" cy="380" r="1.2" />
    <circle cx="770" cy="390" r="1.2" />
  </g>
</svg>
