<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="uniBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3A2C14" />
      <stop offset="60%" stop-color="#1F1708" />
      <stop offset="100%" stop-color="#090602" />
    </radialGradient>
    <linearGradient id="uniGoldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0C4" />
      <stop offset="50%" stop-color="#D8B168" />
      <stop offset="100%" stop-color="#7B561B" />
    </linearGradient>
    <linearGradient id="amberElixir" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CE" />
      <stop offset="50%" stop-color="#E5B652" />
      <stop offset="100%" stop-color="#9C6B1C" />
    </linearGradient>
  </defs>

  <circle cx="150" cy="150" r="146" fill="url(#uniBg)" stroke="url(#uniGoldRing)" stroke-width="3" />
  <circle cx="150" cy="150" r="141" fill="none" stroke="#FFFFFF" stroke-width="0.75" opacity="0.25" />

  <circle cx="150" cy="150" r="85" fill="#D8B168" opacity="0.2" filter="blur(10px)" />

  <g transform="translate(150, 160)">
    <ellipse cx="0" cy="65" rx="55" ry="12" fill="#000000" opacity="0.8" />
    <!-- Square Architectural Heavy Glass Flacon -->
    <rect x="-48" y="-45" width="96" height="105" rx="8" fill="url(#amberElixir)" stroke="#FFF2CE" stroke-width="1.6" />
    <rect x="-42" y="-39" width="84" height="93" rx="5" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4" />
    <path d="M -36 -38 L -28 -38 L -28 50 L -36 50 Z" fill="#FFFFFF" opacity="0.3" />

    <!-- Pure Black Label Inset with Gold Foil -->
    <rect x="-32" y="-12" width="64" height="42" rx="2" fill="#141414" stroke="#D8B168" stroke-width="0.9" />
    <text x="0" y="8" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="11" font-weight="700" letter-spacing="2" fill="#FFF0C4">UNISEX</text>
    <line x1="-15" y1="14" x2="15" y2="14" stroke="#D8B168" stroke-width="0.6" />
    <text x="0" y="23" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" letter-spacing="1.5" fill="#C5A059">NICHE EXTRAIT</text>

    <!-- Collar -->
    <rect x="-16" y="-56" width="32" height="13" fill="#D8B168" />
    <!-- Heavy Cylindrical Gold Cap -->
    <rect x="-24" y="-88" width="48" height="34" rx="3" fill="#D8B168" stroke="#825C18" stroke-width="1.2" />
    <path d="M -24 -75 L 24 -75" stroke="#7A5212" stroke-width="1.5" />
    <circle cx="0" cy="-75" r="3" fill="#FFF0C4" />
  </g>
</svg>
