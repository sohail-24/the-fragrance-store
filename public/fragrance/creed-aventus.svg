<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="crBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24272C" />
      <stop offset="60%" stop-color="#141619" />
      <stop offset="100%" stop-color="#070809" />
    </radialGradient>
    <linearGradient id="crSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#D1D5DB" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#crBg)" />

  <ellipse cx="200" cy="340" rx="80" ry="16" fill="#000000" opacity="0.8" />
  <ellipse cx="200" cy="336" rx="60" ry="10" fill="#94A3B8" opacity="0.2" />

  <!-- Textured Black Cap with Crest -->
  <rect x="172" y="80" width="56" height="48" rx="4" fill="#0F1012" stroke="#374151" stroke-width="1.2" />
  <rect x="170" y="128" width="60" height="12" fill="url(#crSilver)" />

  <!-- Shoulder Slopes & Clear Upper Flacon -->
  <path d="M 180 140 L 150 160 L 142 325 L 258 325 L 250 160 L 220 140 Z" fill="#1E232B" stroke="#4B5563" stroke-width="1.5" />

  <!-- Lower Black Textured Band -->
  <path d="M 145 220 L 255 220 L 258 325 L 142 325 Z" fill="#0D0E11" stroke="#374151" stroke-width="1" />

  <!-- Silver Knight Medallion on Band -->
  <g transform="translate(200, 265)">
    <circle cx="0" cy="0" r="26" fill="#181A1F" stroke="url(#crSilver)" stroke-width="1.5" />
    <!-- Horse & Rider Silhouette in Silver -->
    <path d="M -10 12 L -6 6 L -2 2 L 6 -4 L 12 -2 L 14 6 L 10 12 L 4 8 L 0 10 Z" fill="url(#crSilver)" />
    <circle cx="2" cy="-6" r="3" fill="url(#crSilver)" />
  </g>

  <!-- Upper Clear Glass Label: CREED AVENTUS -->
  <g transform="translate(200, 185)">
    <text x="0" y="0" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" font-weight="700" fill="url(#crSilver)" letter-spacing="4">CREED</text>
    <text x="0" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="900" fill="#F8FAFC" letter-spacing="3">AVENTUS</text>
    <text x="0" y="28" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="8" font-style="italic" fill="#9CA3AF">MILLESIME</text>
  </g>
</svg>
