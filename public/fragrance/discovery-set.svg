<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="setBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#22201D" />
      <stop offset="60%" stop-color="#141312" />
      <stop offset="100%" stop-color="#0A0909" />
    </radialGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DEB6" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#806223" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#setBg)" />
  <ellipse cx="400" cy="510" rx="260" ry="26" fill="#040302" opacity="0.9" />

  <!-- Coffret Presentation Box -->
  <g transform="translate(400, 320)">
    <!-- Outer Coffret Box -->
    <rect x="-240" y="-100" width="480" height="230" rx="10" fill="#181716" stroke="url(#goldAcc)" stroke-width="1.8" />
    <!-- Velvet Inset Bed -->
    <rect x="-225" y="-85" width="450" height="200" rx="6" fill="#0F0E0D" stroke="#33312E" stroke-width="1" />
    
    <!-- Gold Border Inlay on Box Rim -->
    <rect x="-234" y="-94" width="468" height="218" rx="8" fill="none" stroke="url(#goldAcc)" stroke-width="0.8" opacity="0.5" />

    <!-- 5 Miniature Discovery Vials (10ml each) -->
    <!-- Vial 1 -->
    <g transform="translate(-160, 15)">
      <rect x="-18" y="-75" width="36" height="110" rx="5" fill="#E8D19F" fill-opacity="0.85" stroke="url(#goldAcc)" stroke-width="1" />
      <rect x="-10" y="-95" width="20" height="20" rx="2" fill="url(#goldAcc)" />
      <rect x="-14" y="-35" width="28" height="35" rx="1" fill="#FFFFFF" fill-opacity="0.95" />
      <text x="0" y="-14" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="7" font-weight="700" fill="#111111">NO. 1</text>
    </g>

    <!-- Vial 2 -->
    <g transform="translate(-80, 15)">
      <rect x="-18" y="-75" width="36" height="110" rx="5" fill="#E0BC75" fill-opacity="0.85" stroke="url(#goldAcc)" stroke-width="1" />
      <rect x="-10" y="-95" width="20" height="20" rx="2" fill="url(#goldAcc)" />
      <rect x="-14" y="-35" width="28" height="35" rx="1" fill="#FFFFFF" fill-opacity="0.95" />
      <text x="0" y="-14" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="7" font-weight="700" fill="#111111">NO. 2</text>
    </g>

    <!-- Vial 3 (Center) -->
    <g transform="translate(0, 15)">
      <rect x="-18" y="-75" width="36" height="110" rx="5" fill="#D49E4A" fill-opacity="0.9" stroke="url(#goldAcc)" stroke-width="1" />
      <rect x="-10" y="-95" width="20" height="20" rx="2" fill="url(#goldAcc)" />
      <rect x="-14" y="-35" width="28" height="35" rx="1" fill="#FFFFFF" fill-opacity="0.95" />
      <text x="0" y="-14" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="7" font-weight="700" fill="#111111">NO. 3</text>
    </g>

    <!-- Vial 4 -->
    <g transform="translate(80, 15)">
      <rect x="-18" y="-75" width="36" height="110" rx="5" fill="#E5CA92" fill-opacity="0.85" stroke="url(#goldAcc)" stroke-width="1" />
      <rect x="-10" y="-95" width="20" height="20" rx="2" fill="url(#goldAcc)" />
      <rect x="-14" y="-35" width="28" height="35" rx="1" fill="#FFFFFF" fill-opacity="0.95" />
      <text x="0" y="-14" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="7" font-weight="700" fill="#111111">NO. 4</text>
    </g>

    <!-- Vial 5 -->
    <g transform="translate(160, 15)">
      <rect x="-18" y="-75" width="36" height="110" rx="5" fill="#C99440" fill-opacity="0.85" stroke="url(#goldAcc)" stroke-width="1" />
      <rect x="-10" y="-95" width="20" height="20" rx="2" fill="url(#goldAcc)" />
      <rect x="-14" y="-35" width="28" height="35" rx="1" fill="#FFFFFF" fill-opacity="0.95" />
      <text x="0" y="-14" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="7" font-weight="700" fill="#111111">NO. 5</text>
    </g>

    <!-- Coffret Name Plaque on Front -->
    <rect x="-120" y="80" width="240" height="38" rx="3" fill="#141312" stroke="url(#goldAcc)" stroke-width="1" />
    <text x="0" y="98" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="12" letter-spacing="4" fill="#F2DEB6" font-weight="700">DISCOVERY COFFRET</text>
    <text x="0" y="110" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" letter-spacing="2" fill="#C5A059">5 × 10 ML EAU DE PARFUM</text>
  </g>
</svg>
