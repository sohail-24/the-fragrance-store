<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="herBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3D201A" />
      <stop offset="60%" stop-color="#241210" />
      <stop offset="100%" stop-color="#0E0505" />
    </radialGradient>
    <linearGradient id="herRoseGoldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE5D6" />
      <stop offset="50%" stop-color="#D9A384" />
      <stop offset="100%" stop-color="#8C5237" />
    </linearGradient>
    <linearGradient id="roseLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD6C4" />
      <stop offset="50%" stop-color="#EAA688" />
      <stop offset="100%" stop-color="#C26D4D" />
    </linearGradient>
  </defs>

  <circle cx="150" cy="150" r="146" fill="url(#herBg)" stroke="url(#herRoseGoldRing)" stroke-width="3" />
  <circle cx="150" cy="150" r="141" fill="none" stroke="#FFFFFF" stroke-width="0.75" opacity="0.25" />

  <!-- Rose Gold Atmospheric Ambient Glow -->
  <circle cx="150" cy="150" r="85" fill="#D9A384" opacity="0.2" filter="blur(10px)" />

  <!-- Flacon Details (Miss Dior Style) -->
  <g transform="translate(150, 160)">
    <!-- Base Shadow -->
    <ellipse cx="0" cy="65" rx="60" ry="12" fill="#000000" opacity="0.8" />

    <!-- Crystal Rectangular Bottle -->
    <rect x="-56" y="-35" width="112" height="95" rx="6" fill="url(#roseLiquid)" stroke="#F7D8C6" stroke-width="1.8" />
    <!-- Glass Facet Border -->
    <rect x="-50" y="-30" width="100" height="85" rx="4" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4" />
    <!-- Specular Highlight Ray -->
    <path d="M -44 -28 L -36 -28 L -36 50 L -44 50 Z" fill="#FFFFFF" opacity="0.3" />

    <!-- Pure Ivory Plaque Label -->
    <rect x="-35" y="-8" width="70" height="38" rx="2" fill="#FFFFFF" stroke="#D9A384" stroke-width="0.8" />
    <text x="0" y="10" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="12" font-style="italic" font-weight="700" fill="#2E1C16">Pour Elle</text>
    <text x="0" y="21" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" letter-spacing="1.5" fill="#A86A4D">EAU DE PARFUM</text>

    <!-- Metal Neck -->
    <rect x="-18" y="-48" width="36" height="15" fill="#E8D5CA" />

    <!-- Iconic Houndstooth Fabric / Silver Bow -->
    <path d="M -26 -56 C -40 -64 -35 -44 -16 -48 C 0 -50 0 -50 16 -48 C 35 -44 40 -64 26 -56 C 14 -50 0 -48 0 -48 Z" fill="#F4EAE4" stroke="#888888" stroke-width="0.8" />
    <circle cx="0" cy="-48" r="4" fill="#D9A384" />

    <!-- Crystal Cap -->
    <rect x="-24" y="-76" width="48" height="24" rx="3" fill="#FFFFFF" fill-opacity="0.6" stroke="#FFFFFF" stroke-width="1" />
    <rect x="-20" y="-72" width="40" height="16" fill="none" stroke="#D9A384" stroke-width="0.75" />
  </g>
</svg>
