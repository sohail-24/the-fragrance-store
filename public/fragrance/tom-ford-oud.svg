<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="tfBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241E17" />
      <stop offset="60%" stop-color="#14110D" />
      <stop offset="100%" stop-color="#050403" />
    </radialGradient>
    <linearGradient id="tfGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#171513" />
      <stop offset="30%" stop-color="#26211C" />
      <stop offset="50%" stop-color="#362E27" />
      <stop offset="70%" stop-color="#26211C" />
      <stop offset="100%" stop-color="#12100E" />
    </linearGradient>
    <linearGradient id="tfSilverPlaque" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#tfBg)" />

  <!-- Shadow -->
  <ellipse cx="200" cy="342" rx="75" ry="15" fill="#000000" opacity="0.8" />
  <ellipse cx="200" cy="338" rx="55" ry="8" fill="#C5A059" opacity="0.2" />

  <!-- Architectural Chess-piece Cap -->
  <!-- Upper Cap Flange -->
  <rect x="156" y="80" width="88" height="12" rx="2" fill="#1C1814" stroke="#3D352B" stroke-width="1" />
  <!-- Cap Pillar -->
  <rect x="168" y="92" width="64" height="42" fill="#171410" stroke="#3D352B" stroke-width="1" />
  <!-- Collar -->
  <rect x="160" y="134" width="80" height="10" fill="#26211C" stroke="#3D352B" stroke-width="1" />

  <!-- Flacon Body (Smoked Glass Square) -->
  <rect x="145" y="144" width="110" height="182" rx="2" fill="url(#tfGlass)" stroke="#4A3F33" stroke-width="1.2" />

  <!-- Amber Edge Glow -->
  <path d="M 152 150 L 158 150 L 158 320 L 152 320 Z" fill="#D97706" opacity="0.15" />
  <path d="M 242 150 L 248 150 L 248 320 L 242 320 Z" fill="#FFFFFF" opacity="0.12" />

  <!-- Silver Metallic Nameplate -->
  <rect x="160" y="195" width="80" height="78" rx="2" fill="url(#tfSilverPlaque)" stroke="#64748B" stroke-width="1" />
  <rect x="163" y="198" width="74" height="72" rx="1" fill="none" stroke="#475569" stroke-width="0.5" />

  <!-- Text -->
  <g transform="translate(200, 222)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="900" fill="#0F172A" letter-spacing="2">TOM FORD</text>
    <text x="0" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#1E293B" letter-spacing="3">OUD WOOD</text>
    <text x="0" y="34" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="8.5" font-weight="600" fill="#475569" letter-spacing="1">EAU DE PARFUM</text>
    <text x="0" y="44" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7" font-weight="600" fill="#64748B">100 ML</text>
  </g>
</svg>
