<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="60%" stop-color="#0B111D" />
      <stop offset="100%" stop-color="#030509" />
    </radialGradient>
    <linearGradient id="bGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="80%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="bSilverText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D1D5DB" />
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bBg)" />

  <!-- Ground Reflection -->
  <ellipse cx="200" cy="340" rx="85" ry="16" fill="#000000" opacity="0.8" />
  <ellipse cx="200" cy="336" rx="65" ry="10" fill="#3B82F6" opacity="0.2" />

  <!-- Cylindrical Cap -->
  <rect x="168" y="96" width="64" height="42" rx="5" fill="#090D14" stroke="#1E293B" stroke-width="1.5" />
  <!-- Cap Magnetic Ring -->
  <line x1="168" y1="130" x2="232" y2="130" stroke="#334155" stroke-width="1" />

  <!-- Square Architectural Flacon -->
  <rect x="140" y="140" width="120" height="185" rx="6" fill="url(#bGlass)" stroke="#334155" stroke-width="1.5" />

  <!-- Glass Bevels and Highlights -->
  <path d="M 148 148 L 154 148 L 154 317 L 148 317 Z" fill="#FFFFFF" opacity="0.15" />
  <path d="M 246 148 L 252 148 L 252 317 L 246 317 Z" fill="#60A5FA" opacity="0.25" />

  <!-- Blue Glow in Base -->
  <rect x="145" y="275" width="110" height="45" rx="4" fill="#1D4ED8" opacity="0.2" />

  <!-- Chanel Typography -->
  <g transform="translate(200, 215)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="url(#bSilverText)" letter-spacing="4">BLEU</text>
    <text x="0" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#9CA3AF" letter-spacing="3">DE</text>
    <text x="0" y="42" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="800" fill="url(#bSilverText)" letter-spacing="5">CHANEL</text>
    <text x="0" y="65" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" font-weight="600" fill="#E2E8F0" letter-spacing="3">PARFUM</text>
  </g>
</svg>
