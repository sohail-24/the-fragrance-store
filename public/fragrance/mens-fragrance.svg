<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="mensBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#232323" />
      <stop offset="60%" stop-color="#161616" />
      <stop offset="100%" stop-color="#0E0E0E" />
    </radialGradient>
    <linearGradient id="mensCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C6333" />
      <stop offset="30%" stop-color="#E2C78E" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="70%" stop-color="#F3E1BE" />
      <stop offset="100%" stop-color="#6E5325" />
    </linearGradient>
    <linearGradient id="smokedGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A3836" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#22201F" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#121110" stop-opacity="1" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#mensBg)" />
  
  <!-- Subtle circular pedestal reflection -->
  <ellipse cx="400" cy="490" rx="190" ry="24" fill="#050505" opacity="0.85" />
  <ellipse cx="400" cy="485" rx="140" ry="16" fill="#C5A059" opacity="0.12" />

  <!-- Bottle Group -->
  <g transform="translate(400, 310)">
    <!-- Main Smoked Glass Flacon -->
    <rect x="-105" y="-120" width="210" height="260" rx="6" fill="url(#smokedGlass)" stroke="#C5A059" stroke-width="1.8" stroke-opacity="0.8" />
    <!-- Glass Thickness Internal Inset -->
    <rect x="-93" y="-108" width="186" height="236" rx="4" fill="#141312" stroke="#444240" stroke-width="1" />
    <!-- Light Reflection Bar -->
    <path d="M -70 -108 L -58 -108 L -58 128 L -70 128 Z" fill="#FFFFFF" opacity="0.12" />
    
    <!-- Deep Amber Base Tint -->
    <path d="M -90 60 C -40 70 40 70 90 60 L 90 125 L -90 125 Z" fill="#C5A059" opacity="0.18" />

    <!-- Minimalist Label Plaque -->
    <rect x="-65" y="-20" width="130" height="70" rx="2" fill="#181818" stroke="#C5A059" stroke-width="1" />
    <text x="0" y="5" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="14" letter-spacing="4" fill="#FDFBF7" font-weight="700">NOIR CÈDRE</text>
    <line x1="-25" y1="15" x2="25" y2="15" stroke="#C5A059" stroke-width="0.8" />
    <text x="0" y="27" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" letter-spacing="2" fill="#A4803C">EAU DE PARFUM</text>

    <!-- Heavy Brushed Cap -->
    <rect x="-26" y="-146" width="52" height="26" fill="url(#mensCap)" />
    <rect x="-60" y="-195" width="120" height="52" rx="3" fill="url(#mensCap)" stroke="#4A3816" stroke-width="1.5" />
    <line x1="-50" y1="-170" x2="50" y2="-170" stroke="#5E451C" stroke-width="1" />
  </g>
</svg>
