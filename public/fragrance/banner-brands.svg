<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bannerAmbient" cx="60%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3D2912" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#1E1408" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#070707" stop-opacity="0.9" />
    </radialGradient>
    <linearGradient id="chanelBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141E2F" />
      <stop offset="60%" stop-color="#0A111C" />
      <stop offset="100%" stop-color="#03060B" />
    </linearGradient>
    <linearGradient id="versaceTurquoise" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#114555" />
      <stop offset="50%" stop-color="#0A2C38" />
      <stop offset="100%" stop-color="#04151C" />
    </linearGradient>
    <linearGradient id="versaceGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0C4" />
      <stop offset="50%" stop-color="#D8B168" />
      <stop offset="100%" stop-color="#7B561B" />
    </linearGradient>
    <linearGradient id="missDiorPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD5C3" />
      <stop offset="50%" stop-color="#EAA688" />
      <stop offset="100%" stop-color="#C26D4D" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bannerAmbient)" />

  <!-- Textured Amber Ground Refraction -->
  <ellipse cx="320" cy="360" rx="270" ry="35" fill="#D8B168" opacity="0.18" />

  <!-- ============================================== -->
  <!-- 1. BLEU DE CHANEL (Left Bottle)                -->
  <!-- ============================================== -->
  <g transform="translate(130, 240)">
    <ellipse cx="0" cy="115" rx="65" ry="14" fill="#000000" opacity="0.85" />
    <rect x="-60" y="-105" width="120" height="215" rx="8" fill="url(#chanelBlue)" stroke="#2F425F" stroke-width="1.2" />
    <!-- Reflection ray -->
    <path d="M -48 -98 L -38 -98 L -38 100 L -48 100 Z" fill="#FFFFFF" opacity="0.16" />
    <!-- Typography -->
    <text x="0" y="-12" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" letter-spacing="3" fill="#E8EDF5">BLEU</text>
    <text x="0" y="4" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" letter-spacing="2" fill="#7891B3">DE</text>
    <text x="0" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" letter-spacing="3" fill="#E8EDF5">CHANEL</text>
    <!-- Cap -->
    <rect x="-24" y="-124" width="48" height="20" fill="#0C0F14" />
    <rect x="-38" y="-168" width="76" height="46" rx="4" fill="#0C0F14" stroke="#1F2633" stroke-width="1" />
  </g>

  <!-- ============================================== -->
  <!-- 2. VERSACE EROS (Center Bottle)                -->
  <!-- ============================================== -->
  <g transform="translate(320, 235)">
    <ellipse cx="0" cy="120" rx="70" ry="15" fill="#000000" opacity="0.9" />
    <rect x="-65" y="-115" width="130" height="230" rx="10" fill="url(#versaceTurquoise)" stroke="#1C667D" stroke-width="1.4" />
    <!-- Greek Key / Medusa Pattern Texture on Glass -->
    <rect x="-56" y="-105" width="112" height="210" rx="6" fill="none" stroke="#258AA8" stroke-width="0.8" opacity="0.35" stroke-dasharray="4 6" />
    <!-- Gold Medusa Relief Crest -->
    <circle cx="0" cy="-22" r="26" fill="#0A2C38" stroke="url(#versaceGold)" stroke-width="1.8" />
    <!-- Stylized Medusa Silhouette -->
    <circle cx="0" cy="-22" r="14" fill="url(#versaceGold)" />
    <!-- Typography -->
    <text x="0" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" letter-spacing="3" fill="url(#versaceGold)">VERSACE</text>
    <text x="0" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" letter-spacing="3" fill="url(#versaceGold)">EROS</text>
    <!-- Cap -->
    <rect x="-26" y="-136" width="52" height="22" fill="url(#versaceGold)" />
    <rect x="-42" y="-178" width="84" height="44" rx="4" fill="url(#versaceGold)" stroke="#664614" stroke-width="1.2" />
  </g>

  <!-- ============================================== -->
  <!-- 3. MISS DIOR (Right Bottle)                    -->
  <!-- ============================================== -->
  <g transform="translate(500, 260)">
    <ellipse cx="0" cy="95" rx="75" ry="14" fill="#000000" opacity="0.85" />
    <!-- Flacon Body -->
    <rect x="-70" y="-55" width="140" height="145" rx="8" fill="url(#missDiorPink)" stroke="#FCE5D6" stroke-width="1.6" />
    <rect x="-62" y="-47" width="124" height="130" rx="5" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.35" />
    <!-- Plaque Label -->
    <rect x="-44" y="-18" width="88" height="52" rx="3" fill="#FFFFFF" stroke="#D9A384" stroke-width="1" />
    <text x="0" y="6" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="17" font-style="italic" font-weight="700" fill="#2E1C16">Miss Dior</text>
    <text x="0" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" letter-spacing="1.5" fill="#A86A4D">EAU DE PARFUM</text>
    <!-- Houndstooth Fabric Bow -->
    <g transform="translate(0, -66)">
      <path d="M -30 -10 C -50 -20 -40 5 -18 5 C 0 3 0 3 18 5 C 40 5 50 -20 30 -10 C 18 -4 0 0 0 0 Z" fill="#F4EAE4" stroke="#666666" stroke-width="0.8" />
      <circle cx="0" cy="0" r="5" fill="#D9A384" />
    </g>
    <!-- Crystal Cap -->
    <rect x="-28" y="-98" width="56" height="28" rx="4" fill="#FFFFFF" fill-opacity="0.65" stroke="#FFFFFF" stroke-width="1" />
  </g>
</svg>
