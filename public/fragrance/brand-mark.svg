<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="goldMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DEB6" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8E6C2D" />
    </linearGradient>
  </defs>
  <!-- Background Disc in Deep Obsidian -->
  <rect width="160" height="160" rx="16" fill="#111111" />
  <!-- Elegant Dual Hairline Diamond & Oval -->
  <rect x="12" y="12" width="136" height="136" rx="12" fill="none" stroke="url(#goldMark)" stroke-width="1.2" opacity="0.6" />
  <circle cx="80" cy="80" r="62" fill="none" stroke="url(#goldMark)" stroke-width="0.8" opacity="0.3" stroke-dasharray="2 4" />
  
  <!-- Stylized Flacon Monogram / Crest -->
  <!-- Cap -->
  <rect x="71" y="32" width="18" height="14" rx="2" fill="url(#goldMark)" />
  <!-- Collar -->
  <rect x="75" y="46" width="10" height="6" fill="#F2DEB6" />
  <!-- Bottle Contour -->
  <path d="M 52 54 L 108 54 C 112 54 115 57 115 61 L 115 116 C 115 120 112 123 108 123 L 52 123 C 48 123 45 120 45 116 L 45 61 C 45 57 48 54 52 54 Z" fill="none" stroke="url(#goldMark)" stroke-width="1.8" />
  <!-- Monogram Initials KTK -->
  <text x="80" y="93" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="700" letter-spacing="2" fill="url(#goldMark)">KTK</text>
  <line x1="64" y1="102" x2="96" y2="102" stroke="url(#goldMark)" stroke-width="1" opacity="0.7" />
  <text x="80" y="112" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="600" letter-spacing="2" fill="#D9BC7D">PARFUMS</text>
</svg>
