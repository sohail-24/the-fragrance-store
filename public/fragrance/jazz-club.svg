<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="jcBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#312215" />
      <stop offset="60%" stop-color="#19110A" />
      <stop offset="100%" stop-color="#080503" />
    </radialGradient>
    <linearGradient id="jcAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#92400E" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="jcSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#jcBg)" />

  <ellipse cx="200" cy="340" rx="75" ry="15" fill="#000000" opacity="0.8" />
  <ellipse cx="200" cy="336" rx="55" ry="8" fill="#F59E0B" opacity="0.25" />

  <!-- Industrial Apothecary Spray Atomizer without Cap -->
  <rect x="194" y="75" width="12" height="15" fill="url(#jcSilver)" />
  <rect x="188" y="90" width="24" height="20" rx="1" fill="url(#jcSilver)" stroke="#64748B" stroke-width="0.8" />
  <!-- White Cotton String Wrapped Around Collar -->
  <rect x="184" y="110" width="32" height="18" fill="#FAF5EF" stroke="#E2E8F0" stroke-width="1" />
  <line x1="184" y1="114" x2="216" y2="114" stroke="#D1D5DB" stroke-width="1" />
  <line x1="184" y1="118" x2="216" y2="118" stroke="#D1D5DB" stroke-width="1" />
  <line x1="184" y1="122" x2="216" y2="122" stroke="#D1D5DB" stroke-width="1" />

  <!-- Cylindrical Flacon Body with Warm Rum Juice -->
  <rect x="155" y="128" width="90" height="195" rx="12" fill="url(#jcAmber)" stroke="#B45309" stroke-width="1.2" />

  <!-- Cotton Typewriter Fabric Label -->
  <rect x="162" y="170" width="76" height="115" rx="1" fill="#FFFDF8" stroke="#E4E0D8" stroke-width="1" />

  <!-- Typewritten Label Text -->
  <g transform="translate(200, 192)">
    <text x="0" y="0" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#1C1917" letter-spacing="2">REPLICA</text>
    <text x="0" y="11" text-anchor="middle" font-family="'Courier New', monospace" font-size="6" fill="#78716C">MEMORIES IN A SCENT</text>
    <line x1="-30" y1="18" x2="30" y2="18" stroke="#E7E5E4" stroke-width="0.8" />
    <text x="0" y="30" text-anchor="middle" font-family="'Courier New', monospace" font-size="8.5" font-weight="700" fill="#1C1917">Jazz Club</text>
    <text x="0" y="42" text-anchor="middle" font-family="'Courier New', monospace" font-size="5.5" fill="#78716C">Brooklyn, 2013</text>
    <text x="0" y="52" text-anchor="middle" font-family="'Courier New', monospace" font-size="5.5" fill="#78716C">Heady cocktails &amp; cigars</text>
    <line x1="-30" y1="60" x2="30" y2="60" stroke="#E7E5E4" stroke-width="0.8" />
    <text x="0" y="72" text-anchor="middle" font-family="'Courier New', monospace" font-size="6" font-weight="700" fill="#1C1917">Maison Margiela</text>
    <text x="0" y="80" text-anchor="middle" font-family="'Courier New', monospace" font-size="5" fill="#78716C">PARIS</text>
  </g>
</svg>
