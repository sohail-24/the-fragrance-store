user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    server_tokens off;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    map $sent_http_content_type $expires {
        default off;
        text/html epoch;
        text/css max;
        application/javascript max;
        ~image/ max;
        ~font/ max;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' "";
    }

    server {
        listen 80;
        server_name amfruits.shop www.amfruits.shop;

        location ^~ /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
            allow all;
        }

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name amfruits.shop www.amfruits.shop;

        ssl_certificate /etc/letsencrypt/live/amfruits.shop/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/amfruits.shop/privkey.pem;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com;
            style-src 'self' 'unsafe-inline';
            img-src 'self' data: https://res.cloudinary.com https://images.unsplash.com https://*.razorpay.com;
            font-src 'self' data:;
            connect-src 'self' ws: wss: https://api.razorpay.com https://checkout.razorpay.com;
            frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com;
        " always;

        client_max_body_size 50M;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            expires $expires;
            try_files $uri $uri/ /index.html;
        }

        location /api/uploads/ {
            alias /app/uploads/products/;
            expires max;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://app:3000;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
        }

        location /health {
            proxy_pass http://app:3000/health;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        error_page 404 /index.html;

        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
